name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-cd-demo .

      - name: Run Container
        run: |
          docker run -d --name app -p 8000:8000 ci-cd-demo

      - name: Wait for Application
        run: sleep 5

      - name: 
        run: |
          curl --fail http://localhost:8000/health

      - name: Stop container
        if: always()
        run: docker stop app && docker rm app
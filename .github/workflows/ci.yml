name: CI Pipeline

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-cd-demo .

      - name: Run Container
        run: |
          docker run -d --name app -p 8000:8000 ci-cd-demo

      - name: Wait for Application
        run: sleep 5

      - name: Health check
        run: |
          curl --fail http://localhost:8000/health
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
        
      - name: Tag Docker Image
        run: docker tag ci-cd-demo ${{ secrets.DOCKER_USERNAME }}/ci-cd-demo:latest

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd-demo:latest

      - name: Stop container
        if: always()
        run: docker stop app && docker rm app